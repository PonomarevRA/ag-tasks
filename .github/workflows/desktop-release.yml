name: Standalone installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and changelog
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python packaging/release.py --tag "$RELEASE_TAG"
          else
            python packaging/release.py
          fi
  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            payload: "dist/Ag Tasks.app"
          - os: windows-2022
            payload: dist/AgTasks
          - os: ubuntu-24.04
            payload: dist/AgTasks
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64
      - run: python -m pip install ".[desktop,test]"
      - run: npm ci
      - run: python -m pytest -q
      - run: npm test
      - run: python packaging/build.py
      - name: Build native macOS request widget provider
        if: runner.os == 'macOS' && hashFiles('packaging/widgets/macos/build.py') != ''
        run: python packaging/widgets/macos/build.py
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes
      - name: Build macOS installer with widgets
        if: runner.os == 'macOS' && hashFiles('packaging/widgets/macos/build.py') != ''
        run: python packaging/build_installer.py --manifest packaging/desktop-product.json --source "${{ matrix.payload }}" --output artifacts/installers --widgets-source "packaging/widgets/macos/build/AG Requests Widgets.app"
      - name: Build standalone installer
        if: runner.os != 'macOS' || hashFiles('packaging/widgets/macos/build.py') == ''
        run: python packaging/build_installer.py --manifest packaging/desktop-product.json --source "${{ matrix.payload }}" --output artifacts/installers
      - uses: actions/upload-artifact@v4
        with:
          name: ag-tasks-${{ matrix.os }}
          path: artifacts/installers
          if-no-files-found: error
  release:
    if: github.repository == 'PonomarevRA/ag-tasks' && github.ref_type == 'tag'
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release commit is in public main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: ag-tasks-*
          merge-multiple: true
          path: release-assets
      - name: Verify installer checksums and stage release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release.py --tag "$RELEASE_TAG" --artifacts release-assets --output staged-release
      - name: Publish platform installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "ag-tasks $RELEASE_TAG" --notes-file staged-release/notes.md -- staged-release/upload/*
